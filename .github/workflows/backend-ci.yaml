name: LIMS Backend Continuous Integration

on:
  push:
    branches:
      - main
      - feature/fab-manager
  pull_request:
    branches:
      - main

jobs:
  backend-build-and-test:
    name: Spring Boot Backend Tests
    runs-on: ubuntu-latest
    env:
      DB_NAME: lims_db
      DB_USER: lims_admin
      DB_PASSWORD: your_local_db_password_here

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lims_db
          POSTGRES_USER: lims_admin
          POSTGRES_PASSWORD: your_local_db_password_here
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lims_admin -d lims_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Execute Backend Tests
        run: bash ./mvnw test
