# .github/workflows/ci.yml
name: LIMS Frontend Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Regression Testing & Compilation Guardrails
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v4

      - name: Initialize Enterprise Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Monitored Package Dependencies
        run: npm ci

      - name: Execute Enterprise Automated Unit Test Suites
        run: npm run test:ci