# Dev profile: applied when SPRING_PROFILES_ACTIVE=dev
# Allows Hibernate to auto-add new columns/tables introduced by lab-ops feature.
# This overrides the 'validate' setting in application.properties for dev environments only.
spring.jpa.hibernate.ddl-auto=update

# Disable Spring Security's auto-generated login page during local development.
spring.security.user.name=dev
spring.security.user.password=dev
