spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${DB_NAME:lims_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:lims_admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:your_local_db_password_here}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
