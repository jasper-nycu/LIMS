# ==========================================
# 1. Application Identity & Server Config
# ==========================================
spring.application.name=lims-backend
server.port=8080

# Load environment variables from .env file in the project root
spring.config.import=optional:file:../.env[.properties]

# ==========================================
# 2. Database Connection (PostgreSQL)
# ==========================================
# Uses ${} syntax to fetch environment variables in .env file.
# Falls back to the default value after the colon (:) if the variable is not found.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:lims_db}
spring.datasource.username=${DB_USER:lims_admin}
spring.datasource.password=${DB_PASSWORD:SuperSecretPassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. Hibernate / JPA Configuration
# ==========================================
# Set to 'validate' to prevent Hibernate from altering tables, as schema is managed by init.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 4. Mail Server Configuration (for TOTP 2FA)
# ==========================================
# Reserved for future 2FA email implementation (configured for Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:jasper.mg14@nycu.edu.tw}
spring.mail.password=${MAIL_PASSWORD:SuperSecretPassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 5. Security & Cryptographic Keys
# ==========================================
# JWT signing key (prioritizes env variables; falls back to dev default, must be > 256 bits)
lims.security.jwt.secret=${JWT_SECRET:iC2Tk7U05cqH/QE4/rETd4PbcD6KkqvFlS++6mSccAM=}
lims.security.jwt.expiration-hours=24

# AES-256 Master Key used to encrypt ECDSA private keys stored in the database.
# Falls back to a local 32-byte Base64 default string to prevent startup failure if env is missing.
lims.security.aes.master-key=${AES_MASTER_KEY:IC8iPRLvLTza9wzUupfhoUUrEj1yJ1/uL60y5KY3ob8=}

# ==========================================
# 6. Web & CORS Configuration
# ==========================================
# Comma-separated list of allowed origins for Cross-Origin Resource Sharing (CORS).
# Use frontend Vite dev server URLs for local development.
app.cors.allowed-origins=http://localhost:5173,http://localhost

# ==========================================
# 7. Actuator / Monitoring
# ==========================================
management.endpoints.web.exposure.include=health,metrics,info,loggers,httpexchanges,prometheus
management.endpoint.health.show-details=always
management.endpoint.httpexchanges.enabled=true
management.health.mail.enabled=false
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true
info.app.name=LIMS Backend
info.app.version=1.0.0
info.app.description=Cloud-Native Lab Information Management System
