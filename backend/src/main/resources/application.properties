spring.application.name=backend

# Database connection (reads from environment variables set in .env)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:lims_db}
spring.datasource.username=${DB_USER:lims_admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
