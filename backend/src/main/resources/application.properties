spring.application.name=backend
# 資料庫連線設定（對應 .env 檔案中的環境變數）
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:lims}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# 讓 Hibernate 自動根據實體類別建立或更新資料表
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 設定 Spring Security 的預設登入帳密
spring.security.user.name=admin
spring.security.user.password=LimsAdmin123