# ==========================================
# 1. 應用程式基礎設定 (Application Identity)
# ==========================================
spring.application.name=lims-backend
server.port=8080

# ==========================================
# 2. 資料庫連線設定 (Database Connection - PostgreSQL)
# ==========================================
# 使用 ${} 語法，Spring Boot 會自動去系統或 .env 抓取變數。若找不到變數，預設會使用冒號 (:) 後面的備用值。
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:lims_db}
spring.datasource.username=${DB_USER:lims_admin}
spring.datasource.password=${DB_PASSWORD:SuperSecretPassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. Hibernate / JPA 設定 (ORM Framework)
# ==========================================
# 因為我們有 init.sql 自己建表，所以設為 none 或 validate，不要讓 Hibernate 亂改我們的表
spring.jpa.hibernate.ddl-auto=validate
# 在 Console 印出 SQL 語法，方便開發時 Debug (上線時要關掉)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 4. 郵件伺服器設定 (Mail Server for TOTP 2FA)
# ==========================================
# 未來實作 2FA 發信時會用到，先預留位子 (以 Gmail 為例)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 5. JWT 安全密鑰 (Security Secrets)
# ==========================================
# JWT 簽章用的密鑰優先從環境變數讀取，若無則使用開發用預設值 (長度必須超過 256 bits)
lims.security.jwt.secret=${JWT_SECRET:default_local_secret_key_needs_to_be_long_enough_for_dev_only}
lims.security.jwt.expiration-hours=24
